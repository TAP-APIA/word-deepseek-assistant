<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek 文档助手</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="assets/deepseek-whale.png" alt="DeepSeek" />
        <div class="titles">
          <h1>DeepSeek 文档助手</h1>
          <span id="hostBadge" class="badge">正在连接 Word…</span>
        </div>
      </div>
    <div class="top-actions">
      <button id="historyBtn" class="icon-btn" title="历史对话">☰</button>
      <button id="newChatBtn" class="icon-btn" title="新对话">✚</button>
        <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
      </div>
    </header>

    <div id="historyBackdrop" class="history-backdrop hidden"></div>
    <aside id="historyPanel" class="history-panel">
      <div class="history-head">
        <span>历史对话</span>
        <button id="historyCloseBtn" class="icon-btn" title="关闭">×</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </aside>

    <section class="context-bar">
      <label class="check"><input type="checkbox" id="includeSelection" checked /> 附带选中内容</label>
      <label class="check"><input type="checkbox" id="includeDocStart" checked /> 附带文档内容</label>
      <button id="refreshCtxBtn" class="mini-btn" title="刷新选中内容信息">刷新</button>
      <span id="ctxInfo" class="ctx-info"></span>
    </section>

    <main id="messages" class="messages"></main>

    <footer class="composer">
      <div class="input-wrap">
        <textarea id="userInput" rows="4" placeholder="输入指令，例如：帮我润色选中的段落，改成更正式的语气…"></textarea>
        <button id="sendBtn" class="send-btn">发送</button>
      </div>
      <div id="statusLine" class="status-line"></div>
    </footer>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal-mask hidden">
    <div class="modal">
      <h2>设置</h2>
      <label class="field">
        <span>DeepSeek API Key</span>
        <input type="password" id="apiKeyInput" placeholder="sk-…" autocomplete="off" />
      </label>
      <button id="fetchModelsBtn" class="action-btn primary fetch-btn">获取模型列表</button>
      <label class="field">
        <span>模型（来自 DeepSeek API 实时拉取）</span>
        <select id="modelSelect" disabled>
          <option value="">填写 API Key 后点击“获取模型列表”</option>
        </select>
      </label>
      <label class="field">
        <span>思考强度</span>
        <select id="effortSelect">
          <option value="low">低</option>
          <option value="high">标准（默认）</option>
          <option value="max">最高</option>
        </select>
      </label>
      <label class="field">
        <span>自定义模型（可选）</span>
        <input type="text" id="customModelInput" placeholder="留空使用上方模型" />
      </label>
      <p id="settingsStatus" class="modal-note"></p>
      <p class="modal-note">
        API Key 仅保存在本机浏览器的本地存储中，请求直接发送给 DeepSeek 官方 API（已实测支持浏览器跨域直连）。
        本版本无需本地服务，任务窗格页面由静态托管提供。
      </p>
      <div class="modal-actions">
        <button id="cancelSettingsBtn" class="action-btn">取消</button>
        <button id="saveSettingsBtn" class="action-btn primary" disabled>保存设置</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- 回退确认弹窗 -->
  <div id="confirmModal" class="modal-mask hidden">
    <div class="modal">
      <h2>回退确认</h2>
      <p id="confirmMsg" class="modal-note"></p>
      <div class="modal-actions">
        <button id="confirmCancelBtn" class="action-btn">取消</button>
        <button id="confirmOkBtn" class="action-btn primary">确定</button>
      </div>
    </div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
